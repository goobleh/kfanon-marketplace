    .empty{padding:42px 20px;text-align:center;border:1px solid #eee;border-radius:8px;color:#777;font-size:14px}.empty strong{display:block;color:#222;margin-bottom:7px;font-size:15px}

    .form-wrap{max-width:720px}.create-layout{display:block;width:100%}.create-layout .form-wrap{max-width:none;width:100%}#releaseForm{display:grid;width:100%;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:32px;align-items:start}#releaseForm>.create-fields{grid-column:1;min-width:0}#releaseForm>.preview-panel{grid-column:2;position:sticky;top:88px;align-self:start;min-width:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}.field label{font-size:13px;font-weight:650}.field input,.field textarea,.field select{border:1px solid #dedede;border-radius:6px;padding:11px 12px;background:#fff;color:#171717;outline:none;width:100%;font-size:14px}.field input:focus,.field textarea:focus,.field select:focus{border-color:#777}.field textarea{resize:vertical;min-height:84px}.hint{font-size:12px;color:#888;margin-top:-2px}.track-row{display:grid;grid-template-columns:30px 1fr 1fr 36px;gap:9px;align-items:center;margin-bottom:9px}.track{align-items:center}.track-num{font-size:12px;color:#888;text-align:center}.track-row input{min-width:0;border:1px solid #dedede;border-radius:6px;padding:10px;font-size:13px}.icon-button{border:0;background:none;color:#888;font-size:18px;padding:5px}.form-actions{display:flex;gap:10px;align-items:center;margin-top:22px}
    .tabs{display:flex;gap:20px;border-bottom:1px solid #eee;margin-bottom:25px}.tabs button{background:none;border:0;padding:0 0 12px;color:#777;font-size:14px}.tabs button.active{color:#171717;border-bottom:2px solid #171717;font-weight:650}
    .profile-head{display:flex;align-items:center;gap:16px;margin-bottom:28px}.profile-head .avatar{width:58px;height:58px;font-size:28px}.profile-head h2{margin:0 0 4px;font-size:22px}.profile-head p{margin:0;color:#777;font-size:13px}
    .notice{padding:12px 14px;background:#f7f7f7;border-radius:6px;color:#555;font-size:13px;line-height:1.5;margin:0 0 18px}.error{color:#b42318;font-size:13px;margin:10px 0}.success{color:#237a45;font-size:13px;margin:10px 0}
    .modal-backdrop{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal{width:100%;max-width:430px;background:#fff;border-radius:10px;padding:28px;max-height:90vh;overflow:auto}.modal h2{font-size:22px;margin:0 0 7px}.modal p{font-size:13px;color:#777;margin:0 0 22px;line-height:1.5}.modal-close{float:right;border:0;background:none;font-size:22px;color:#888}.modal-switch{font-size:13px;color:#777;margin-top:18px}.modal-switch button{border:0;background:none;text-decoration:underline;padding:0;color:#171717}
    .detail{display:grid;grid-template-columns:minmax(220px,360px) 1fr;gap:34px;align-items:start}.detail .cover{border-radius:5px}.detail h1{font-size:32px;letter-spacing:-1px;margin:0 0 7px}.detail-meta{color:#777;font-size:14px;margin-bottom:18px}.detail-description{font-size:14px;line-height:1.7;color:#555;white-space:pre-wrap}.people-list{display:grid;gap:12px;margin:20px 0;padding:16px 0;border-top:1px solid #eee;border-bottom:1px solid #eee}.rating-panel{border-top:1px solid #eee;border-bottom:1px solid #eee;padding:18px 0;margin-top:20px}.rating-summary{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}.rating-average{font-size:24px;font-weight:700;letter-spacing:-.8px}.rating-count{font-size:12px;color:#888}.rating-stars{display:flex;gap:3px;align-items:center;flex-wrap:wrap}.rating-star{border:0;background:none;padding:2px;color:#d5d5d5;font-size:25px;line-height:1;touch-action:pan-y}.rating-star.selected,.rating-star.active{color:#e4ad35}.rating-star:focus-visible{outline:2px solid #777;outline-offset:2px;border-radius:4px}.rating-controls{display:flex;align-items:center;gap:10px;margin-top:12px}.rating-controls .muted{font-size:12px}.rating-panel .hint{display:block;margin-top:8px}.comments-panel{border-top:1px solid #eee;padding-top:18px;margin-top:20px}.comments-panel h2{font-size:17px;margin:0 0 15px}.comment-form textarea,.reply-form textarea{width:100%;min-height:72px;resize:vertical;border:1px solid #dedede;border-radius:6px;padding:10px;font:inherit;font-size:13px}.comment-form .button,.reply-form .button{margin-top:8px}.comment{padding:14px 0;border-bottom:1px solid #eee}.comment-head{display:flex;align-items:center;gap:9px;font-size:13px}.comment-head .avatar{width:30px;height:30px}.comment-time{margin-left:auto;color:#999;font-size:11px}.comment-text{font-size:13px;line-height:1.6;white-space:pre-wrap;margin:9px 0 8px 39px;overflow-wrap:anywhere}.comment-actions{margin-left:39px}.comment-actions button{border:0;background:none;color:#777;font-size:12px;padding:3px 10px 3px 0}.reply-list{margin:12px 0 0 39px;padding-left:14px;border-left:2px solid #eee}.reply{padding:8px 0}.reply .avatar{width:25px;height:25px}.reply .comment-text{margin-left:34px}.reply-form{margin:10px 0 4px 39px}.notification-button{position:relative;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0!important;color:#555!important;border-radius:50%}.notification-button:hover{background:#f5f5f5}.notification-button svg{width:19px;height:19px;display:block}.notification-dot{position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:#e04444;border:2px solid #fff;box-sizing:content-box}.notification-list{border-top:1px solid #eee}.notification-item{display:flex;gap:12px;align-items:flex-start;padding:16px 0;border-bottom:1px solid #eee;cursor:pointer}.notification-item.unread{background:#fafafa}.notification-item p{margin:0;color:#555;font-size:13px;line-height:1.5}.notification-item small{color:#999;font-size:11px}.person-row{display:flex;align-items:center;gap:10px;font-size:13px}.person-row .avatar{width:36px;height:36px}.person-label{display:block;color:#888;font-size:11px;margin-bottom:2px}.marketplace-badge{font-size:11px;color:#237a45;margin-top:12px}.track-list{margin-top:25px;border-top:1px solid #eee}.track{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #eee;font-size:13px}.track span:first-child{color:#888;width:25px}.track .track-title{flex:1}.track .track-credit{color:#888;text-align:right}
    .footer{border-top:1px solid #eee;padding:24px;text-align:center;color:#999;font-size:12px}
    .browse-controls{display:flex;gap:10px;margin:-6px 0 20px;align-items:center}.browse-controls input,.browse-controls select{border:1px solid #dedede;border-radius:6px;padding:10px 12px;background:#fff;color:#171717;font-size:13px;min-width:0}.browse-controls input{flex:1;min-width:160px}.browse-controls select{min-width:130px}.library-controls{margin-top:0}@media(max-width:600px){.browse-controls{flex-wrap:wrap}.browse-controls input{flex-basis:100%}.browse-controls select{flex:1;min-width:0}}
    @media(max-width:800px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.topbar{padding:0 18px}.nav{gap:14px}main{padding:34px 20px 60px}.create-layout{grid-template-columns:1fr;gap:0}#releaseForm{grid-template-columns:1fr;column-gap:0}#releaseForm>.create-fields,#releaseForm>.preview-panel{grid-column:1;grid-row:auto}#releaseForm>.preview-panel{position:static;margin:0 0 22px}.preview-grid{max-width:none}}
    @media(max-width:600px){.track-row{grid-template-columns:22px minmax(90px,1fr) minmax(90px,1fr) 25px;gap:5px}.track-row input{padding:9px 6px;font-size:11px}.topbar{height:auto;min-height:60px;flex-wrap:wrap;padding:13px 16px;gap:12px}.nav{order:3;width:100%;justify-content:space-between;border-top:1px solid #eee;padding-top:9px}.account-actions{margin-left:auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 13px}.hero{padding:18px 0 27px}.form-grid{grid-template-columns:1fr;gap:0}.detail{grid-template-columns:1fr;gap:22px}.detail .cover{max-width:360px}.track-row{grid-template-columns:25px 1fr 1fr 28px;gap:5px}.track-row input{padding:9px 7px;font-size:12px}.section-head{align-items:center}}
  </style>

<body>
  <header class="topbar">
    <div class="brand" id="brandHome">K-FANON <span>MARKETPLACE</span></div>
    <nav class="nav" aria-label="Main navigation">
      <button class="active" data-page="discover">Discover</button>
      <button data-page="create">Create</button>
      <button data-page="library">My library</button>
    </nav>
    <div class="account-actions" id="accountActions"><button class="button" id="loginOpen">Log in</button><button class="button primary" id="signupOpen">Sign up</button></div>
  </header>
  <main id="app"><div class="empty">Loading marketplace…</div></main>
  <footer class="footer">K-Fanon Marketplace</footer>
  <div id="modalRoot"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAuth, setPersistence, browserLocalPersistence, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, query, where, orderBy, limit, getDocs, onSnapshot, serverTimestamp, runTransaction } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDvKObfLoyBrds-cSrtV9DSnBgCAXS28Mw",
      authDomain: "kfanon.firebaseapp.com",
      projectId: "kfanon",
      storageBucket: "kfanon.firebasestorage.app",
      messagingSenderId: "299218679697",
      appId: "1:299218679697:web:16e0b76721f5dbc3384c30"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const db = getFirestore(firebaseApp);
    await setPersistence(auth, browserLocalPersistence);

    const appRoot = document.getElementById("app");
    const modalRoot = document.getElementById("modalRoot");
    const accountActions = document.getElementById("accountActions");
    let currentUser = null;
    let currentProfile = null;
    let currentPage = "discover";
    let libraryTab = "releases";
    let cachedReleases = [];
    let editingReleaseId = null;
    let editingReleaseData = null;
    let notificationCache = [];
    let notificationUnsubscribe = null;

    const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const safeImageUrl = value => { try { const url=new URL(value); return url.protocol==="https:" ? url.href : ""; } catch { return ""; } };
    const imageSource = (data,url) => data || safeImageUrl(url);
    async function compressImage(file,maxSide=800,maxChars=420000){
      if(!file) return "";
      if(!file.type.startsWith("image/")) throw new Error("Choose an image file.");
      if(file.size>10*1024*1024) throw new Error("Choose an image smaller than 10 MB.");
      const bitmap=await createImageBitmap(file);
      const scale=Math.min(1,maxSide/Math.max(bitmap.width,bitmap.height));
      const canvas=document.createElement("canvas");
      canvas.width=Math.max(1,Math.round(bitmap.width*scale));
      canvas.height=Math.max(1,Math.round(bitmap.height*scale));
      canvas.getContext("2d").drawImage(bitmap,0,0,canvas.width,canvas.height);
      bitmap.close();
      let quality=.82,result=canvas.toDataURL("image/jpeg",quality);
      while(result.length>maxChars && quality>.42){quality-=.08;result=canvas.toDataURL("image/jpeg",quality);}
      if(result.length>maxChars) throw new Error("This image is too detailed to store. Try a smaller image.");
      return result;
    }
    const avatarMarkup = (url,label="Profile picture",data="") => { const safe=imageSource(data,url); return '<span class="avatar">'+(safe?'<img src="'+escapeHtml(safe)+'" alt="'+escapeHtml(label)+'" referrerpolicy="no-referrer" onerror="this.remove()">':'')+'</span>'; };
    const showMessage = (text, type="error", target="formMessage") => { const node=document.getElementById(target); if(node){node.className=type;node.textContent=text;} };
    const friendlyError = error => {
      const messages = {
        "auth/email-already-in-use":"That email address is already registered.",
        "auth/invalid-email":"Enter a valid email address.",
        "auth/weak-password":"Choose a password with at least 6 characters.",
        "auth/invalid-credential":"Email or password is incorrect.",
        "auth/user-not-found":"No account was found with that email.",
        "auth/wrong-password":"Email or password is incorrect.",
        "permission-denied":"Firebase blocked this action. Check that the Firestore rules have been published.",
        "failed-precondition":"This query needs a Firestore index. Try again in a moment."
      };
      return messages[error.code] || error.message || "Something went wrong. Please try again.";
    };

    function renderShell(title, intro, content) {
      appRoot.innerHTML = (title ? '<h1 class="page-title">'+escapeHtml(title)+'</h1><p class="page-intro">'+escapeHtml(intro||"")+'</p>' : "") + content;
    }
    function coverMarkup(release, extraClass="") {
      const url = imageSource(release.coverData,release.coverUrl);
      return '<div class="cover '+extraClass+'">'+(url ? '<img src="'+escapeHtml(url)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove();this.parentElement.textContent=\'♪\'">' : "♪")+'</div>';
    }
    function releaseCard(release) {
      return '<article class="release" data-release="'+escapeHtml(release.id)+'">'+coverMarkup(release)+'<h3>'+escapeHtml(release.title)+'</h3><div class="release-meta"><div class="sub">'+escapeHtml(release.artist||"Unknown artist")+'</div><div class="tag">'+escapeHtml(release.type||"Album")+' · '+escapeHtml(release.tracks?.length||0)+' tracks</div></div></article>';
    }
    function timestampValue(value){if(!value)return 0;if(typeof value.toMillis==="function")return value.toMillis();if(typeof value.seconds==="number")return value.seconds*1000;const parsed=new Date(value).getTime();return Number.isFinite(parsed)?parsed:0;}
    function bindCards() {
      document.querySelectorAll("[data-release]").forEach(card=>card.addEventListener("click",()=>openRelease(card.dataset.release)));
    }

    let marketplaceReleases=[], discoverReleases=[];
    function searchModeOptions(){
      return '<option value="all">All fields</option><option value="artist">Artists</option><option value="release">Releases</option><option value="song">Song titles</option>';
    }
    function releaseControls(prefix){
      return '<div class="browse-controls"><select id="'+prefix+'Mode" aria-label="Search by">'+searchModeOptions()+'</select><input id="'+prefix+'Search" type="search" placeholder="Search all fields…" aria-label="Search releases"><select id="'+prefix+'Type" aria-label="Filter by release type"><option value="">All release types</option><option>Album</option><option>EP</option><option>Single</option><option>Mixtape</option></select><select id="'+prefix+'Sort" aria-label="Sort releases"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="title">Title A–Z</option><option value="artist">Artist A–Z</option></select></div>';
    }
    function releaseMatchesSearch(release,term,mode){
      if(!term)return true;
      const contains=value=>String(value||"").toLowerCase().includes(term.toLowerCase());
      if(mode==="artist")return contains(release.artist);
      if(mode==="release")return contains(release.title);
      if(mode==="song")return (release.tracks||[]).some(track=>contains(track.title));
      return [release.title,release.artist,release.creatorName,release.ownerName].some(contains)||(release.tracks||[]).some(track=>contains(track.title));
    }
    function filteredReleases(items,prefix,dateField="createdAt"){
      const term=(document.getElementById(prefix+"Search")?.value||"").trim();
      const mode=document.getElementById(prefix+"Mode")?.value||"all";
      const type=document.getElementById(prefix+"Type")?.value||"";
      const sort=document.getElementById(prefix+"Sort")?.value||"newest";
      const result=items.filter(r=>(!type||r.type===type)&&releaseMatchesSearch(r,term,mode));
      result.sort((a,b)=>{
        if(sort==="title")return String(a.title||"").localeCompare(String(b.title||""));
        if(sort==="artist")return String(a.artist||"").localeCompare(String(b.artist||""));
        return sort==="oldest"?timestampValue(a[dateField])-timestampValue(b[dateField]):timestampValue(b[dateField])-timestampValue(a[dateField]);
      });
      return result;
    }
    function renderDiscoverResults(){
      const listed=filteredReleases(marketplaceReleases,"marketplace");
      const recent=filteredReleases(discoverReleases,"discover");
      document.getElementById("marketplaceSection").style.display=marketplaceReleases.length?"block":"none";
      document.getElementById("marketplaceCount").textContent=listed.length+" of "+marketplaceReleases.length+" available";
      document.getElementById("marketplaceGrid").innerHTML=listed.length?listed.map(releaseCard).join(""):'<div class="empty" style="grid-column:1/-1">No marketplace releases match those filters.</div>';
      document.getElementById("releaseCount").textContent=recent.length+" of "+discoverReleases.length+" releases";
      document.getElementById("discoverGrid").innerHTML=recent.length?recent.map(releaseCard).join(""):'<div class="empty" style="grid-column:1/-1"><strong>No releases found.</strong>Try changing your search or filters.</div>';
      bindCards();
    }
    async function loadDiscover() {
      currentPage="discover";
      renderShell("", "", '<section class="hero"><div class="eyebrow">A home for fictional music</div><h1>Your next favourite<br>release starts here.</h1><p>Explore fan-made K-pop discographies, build fictional albums and EPs, and bring your artists to life.</p></section><section id="marketplaceSection" style="display:none;margin-bottom:38px"><div class="section-head"><h2>Available to claim</h2><span class="muted" id="marketplaceCount"></span></div>'+releaseControls("marketplace")+'<div id="marketplaceGrid" class="grid"></div></section><div class="section-head"><h2>Recently published</h2><span class="muted" id="releaseCount"></span></div>'+releaseControls("discover")+'<div id="discoverGrid" class="grid"><div class="muted">Loading releases…</div></div>');
      document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page==="discover"));
      try {
        const snap=await getDocs(query(collection(db,"releases"),where("published","==",true)));
        cachedReleases=snap.docs.map(d=>({id:d.id,...d.data()}));
        marketplaceReleases=cachedReleases.filter(r=>r.marketplaceListed===true&&r.ownerId!==(currentUser?.uid||""));
        discoverReleases=cachedReleases.filter(r=>r.marketplaceListed!==true);
        ["marketplace","discover"].forEach(prefix=>{["Search","Type","Sort","Mode"].forEach(suffix=>document.getElementById(prefix+suffix).addEventListener(suffix==="Search"?"input":"change",renderDiscoverResults));document.getElementById(prefix+"Search").setAttribute("placeholder","Search "+prefix+"…");});
        renderDiscoverResults();
      } catch(error) { document.getElementById("discoverGrid").innerHTML='<div class="empty" style="grid-column:1/-1"><strong>Could not load releases.</strong>'+escapeHtml(friendlyError(error))+'</div>'; }
    }

    function openAuth(mode="login") {
      const signup=mode==="signup";
      modalRoot.innerHTML='<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="authTitle"><button class="modal-close" id="modalClose" aria-label="Close">×</button><h2 id="authTitle">'+(signup?"Create your account":"Welcome back")+'</h2><p>'+(signup?"Set up your K-Fanon Marketplace profile.":"Log in to continue to your marketplace.")+'</p><form id="authForm">'+(signup?'<div class="field"><label for="username">Username</label><input id="username" name="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" placeholder="yourusername" required><span class="hint">3–20 characters. Letters, numbers and underscores.</span></div><div class="field"><label for="displayName">Display name</label><input id="displayName" name="displayName" maxlength="32" placeholder="How should we know you?" required></div><div class="field"><label for="profilePicture">Profile picture</label><input id="profilePicture" type="file" accept="image/*"><span class="hint">Choose an image from your device. It will be resized before saving.</span></div>':"")+'<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" minlength="6" autocomplete="'+(signup?"new-password":"current-password")+'" required></div><div id="formMessage" class="error" role="alert"></div><button class="button primary" style="width:100%" type="submit">'+(signup?"Create account":"Log in")+'</button></form><div class="modal-switch">'+(signup?'Already have an account? <button id="switchAuth">Log in</button>':'New here? <button id="switchAuth">Create an account</button>')+'</div></section></div>';
      document.getElementById("modalClose").onclick=closeModal;
      document.getElementById("modalBackdrop").onclick=e=>{if(e.target.id==="modalBackdrop")closeModal()};
      document.getElementById("switchAuth").onclick=()=>openAuth(signup?"login":"signup");
      document.getElementById("authForm").onsubmit=async e=>{
        e.preventDefault(); const form=e.currentTarget; const button=form.querySelector("button[type=submit]"); button.disabled=true;button.textContent="Please wait…";
        try {
          const email=form.email.value.trim(); const password=form.password.value;
          if(signup){
            const username=form.username.value.trim().toLowerCase();
            if(!/^[a-z0-9_]{3,20}$/.test(username)) throw new Error("Username must be 3–20 characters using letters, numbers or underscores.");
            const displayName=form.displayName.value.trim(); if(!displayName) throw new Error("Please enter a display name.");
            const avatarData=await compressImage(form.profilePicture.files[0],320,180000);
            const credential=await createUserWithEmailAndPassword(auth,email,password);
            const profile={uid:credential.user.uid,username,displayName,avatarUrl:"",avatarData,createdAt:serverTimestamp()};
            try {
              await runTransaction(db,async transaction=>{
                const usernameRef=doc(db,"usernames",username);
                const usernameSnap=await transaction.get(usernameRef);
                if(usernameSnap.exists()) throw new Error("That username is already taken. Try another one.");
                transaction.set(usernameRef,{uid:credential.user.uid});
                transaction.set(doc(db,"users",credential.user.uid),profile);
              });
            } catch(err) { await credential.user.delete(); throw err; }
            await updateProfile(credential.user,{displayName});
            currentUser=credential.user;
            currentProfile=profile;
            updateAccountUI();
            closeModal();
            await loadDiscover();
            return;
          } else { await signInWithEmailAndPassword(auth,email,password); }
          closeModal();
        } catch(error) { showMessage(friendlyError(error)); button.disabled=false;button.textContent=signup?"Create account":"Log in"; }
      };
    }

    function renderRatingPanel(release,id){
      if(ratingUnsubscribe){ratingUnsubscribe();ratingUnsubscribe=null;}
      const panel=document.getElementById("ratingContent");
      if(!panel||!release.published||release.ratingsEnabled!==true)return;
      let draft=0,ownRating=0;
      const canRate=!!currentUser&&release.ownerId!==currentUser.uid;
      const draw=ratings=>{
        const values=ratings.map(x=>Number(x.score)).filter(x=>Number.isInteger(x)&&x>=1&&x<=10);
        const average=values.length?values.reduce((a,b)=>a+b,0)/values.length:0;
        const summary='<div class="rating-summary"><span class="rating-average">'+(values.length?average.toFixed(1):"—")+'</span><span class="muted">/ 10</span><span class="rating-count">'+values.length+' '+(values.length===1?'rating':'ratings')+'</span></div>';
        if(!canRate){
          panel.innerHTML=summary+'<div class="muted">'+(currentUser?'You cannot rate your own release.':'Log in to rate this release.')+'</div>';
          return;
        }
        const stars=Array.from({length:10},(_,i)=>'<button type="button" class="rating-star '+(i+1<=draft?'active':'')+'" data-rating="'+(i+1)+'" aria-label="Rate '+(i+1)+' out of 10" aria-pressed="'+(i+1===draft)+'">★</button>').join("");
        panel.innerHTML=summary+'<div class="rating-stars" id="ratingStars">'+stars+'</div><div class="rating-controls"><button class="button primary" id="submitRating" type="button" '+(!draft?'disabled':'')+'>'+(ownRating?'Update rating':'Submit rating')+'</button><span class="muted">'+(ownRating?'Your rating: '+ownRating+'/10':(draft?'Selected: '+draft+'/10':'Choose a rating'))+'</span></div><span class="hint">Select a star or drag across the stars, then submit your rating.</span>';
        const starBox=document.getElementById("ratingStars");
        const updateSelection=star=>{
          if(!star)return;
          draft=Number(star.dataset.rating);
          starBox.querySelectorAll("[data-rating]").forEach(x=>{const active=Number(x.dataset.rating)<=draft;x.classList.toggle("active",active);x.setAttribute("aria-pressed",String(Number(x.dataset.rating)===draft));});
          const status=panel.querySelector(".rating-controls .muted");if(status)status.textContent="Selected: "+draft+"/10";
          const submit=document.getElementById("submitRating");if(submit)submit.disabled=false;
        };
        starBox.addEventListener("pointerdown",e=>{const star=e.target.closest("[data-rating]");if(star){e.preventDefault();updateSelection(star);}});
        starBox.addEventListener("pointermove",e=>{if(e.buttons===1||e.pointerType==="touch")updateSelection(e.target.closest("[data-rating]"));});
        starBox.addEventListener("click",e=>updateSelection(e.target.closest("[data-rating]")));
        document.getElementById("submitRating").onclick=async()=>{
          const button=document.getElementById("submitRating");if(!draft)return;button.disabled=true;button.textContent="Saving…";
          try{await setDoc(doc(db,"releases",id,"ratings",currentUser.uid),{userId:currentUser.uid,score:draft,updatedAt:serverTimestamp()});ownRating=draft;const snap=await getDocs(collection(db,"releases",id,"ratings"));draw(snap.docs.map(d=>d.data()));}
          catch(error){alert(friendlyError(error));button.disabled=false;button.textContent=ownRating?"Update rating":"Submit rating";}
        };
      };
      ratingUnsubscribe=onSnapshot(collection(db,"releases",id,"ratings"),snapshot=>{
        const ratings=snapshot.docs.map(d=>d.data());const own=currentUser?ratings.find(x=>x.userId===currentUser.uid):null;ownRating=own?Number(own.score):0;if(!draft)draft=ownRating;draw(ratings);
      },error=>{panel.innerHTML='<div class="error">'+escapeHtml(friendlyError(error))+'</div>';});
    }
    function personRow(label,name,avatarUrl,avatarData){return '<div class="person-row">'+avatarMarkup(avatarUrl,name||"Profile picture",avatarData)+'<div><span class="person-label">'+escapeHtml(label)+'</span><strong>'+escapeHtml(name||"Community member")+'</strong></div></div>';}
    async function claimRelease(id){
      if(!currentUser){openAuth("login");return;}
      if(!confirm("Claim this release? It will move into your library and no longer be available for others to claim."))return;
      try{
        await runTransaction(db,async transaction=>{
          const releaseRef=doc(db,"releases",id), releaseSnap=await transaction.get(releaseRef);
          if(!releaseSnap.exists())throw new Error("This release is no longer available.");
          const release=releaseSnap.data();
          if(release.marketplaceListed!==true||release.published!==true)throw new Error("This release is no longer available to claim.");
          if(release.ownerId===currentUser.uid)throw new Error("You already own this release.");
          transaction.update(releaseRef,{ownerId:currentUser.uid,ownerName:currentProfile.displayName||currentProfile.username,ownerAvatarUrl:currentProfile.avatarUrl||"",ownerAvatarData:currentProfile.avatarData||"",creatorId:release.creatorId||release.ownerId,creatorName:release.creatorName||release.ownerName||"Community member",creatorAvatarUrl:release.creatorAvatarUrl??release.ownerAvatarUrl??"",creatorAvatarData:release.creatorAvatarData??release.ownerAvatarData??"",published:false,marketplaceListed:false,claimedAt:serverTimestamp(),updatedAt:serverTimestamp()});
        });
        await openRelease(id);
      }catch(error){alert(friendlyError(error));}
    }
    async function openRelease(id){
      let release=cachedReleases.find(r=>r.id===id);
      try{const snap=await getDoc(doc(db,"releases",id));if(!snap.exists())throw new Error("This release is no longer available.");release={id:snap.id,...snap.data()};}
      catch(error){renderShell("Release unavailable","",'<div class="error">'+escapeHtml(friendlyError(error))+'</div><button class="button" id="backDiscover">Back to Discover</button>');document.getElementById("backDiscover").onclick=loadDiscover;return;}
      if(!release.published && release.ownerId!==currentUser?.uid){loadDiscover();return;}
      currentPage="detail";
      const creatorId=release.creatorId||release.ownerId;
      let creator={name:release.creatorName||release.ownerName||"A community member",avatarUrl:release.creatorAvatarUrl??release.ownerAvatarUrl??"",avatarData:release.creatorAvatarData??release.ownerAvatarData??""};
      let owner={name:release.ownerName||"A community member",avatarUrl:release.ownerAvatarUrl||"",avatarData:release.ownerAvatarData||""};
      try{const [creatorSnap,ownerSnap]=await Promise.all([getDoc(doc(db,"users",creatorId)),getDoc(doc(db,"users",release.ownerId))]);if(creatorSnap.exists()){const p=creatorSnap.data();creator={name:p.displayName||p.username||creator.name,avatarUrl:p.avatarUrl||creator.avatarUrl,avatarData:p.avatarData||creator.avatarData};}if(ownerSnap.exists()){const p=ownerSnap.data();owner={name:p.displayName||p.username||owner.name,avatarUrl:p.avatarUrl||owner.avatarUrl,avatarData:p.avatarData||owner.avatarData};}}catch(error){console.warn("Could not load release credits:",error);}
      const hasDifferentOwner=release.ownerId!==creatorId;
      renderShell("", "",'<div class="detail"><div class="detail-artwork">'+coverMarkup(release)+'<div class="people-list">'+personRow("Created by",creator.name,creator.avatarUrl,creator.avatarData)+(hasDifferentOwner?personRow("Owned by",owner.name,owner.avatarUrl,owner.avatarData):"")+'</div>'+(release.published&&release.ratingsEnabled===true?'<section class="rating-panel"><div id="ratingContent"><div class="muted">Loading ratings…</div></div></section>':"")+'<section class="comments-panel"><h2>Comments</h2><div id="commentsContent"><div class="muted">Loading comments…</div></div></section></div><div><div class="eyebrow">'+escapeHtml(release.type||"Release")+'</div><h1>'+escapeHtml(release.title)+'</h1><div class="detail-meta">'+escapeHtml(release.artist)+'</div><div class="detail-description">'+escapeHtml(release.description||"")+'</div>'+(release.marketplaceListed&&release.ownerId!==currentUser?.uid?'<div class="marketplace-badge">Available to claim</div><div class="form-actions"><button class="button primary" id="claimRelease">Claim this release</button></div>':"")+'<div class="track-list">'+(release.tracks||[]).map((t,i)=>'<div class="track"><span>'+String(i+1).padStart(2,"0")+'</span><span class="track-title">'+escapeHtml(t.title)+'</span><span class="track-credit">'+escapeHtml(t.credit||"")+'</span></div>').join("")+'</div>'+(release.ownerId===currentUser?.uid?'<div class="form-actions"><button class="button" id="editRelease">Edit release</button><button class="button" id="deleteRelease">Delete</button></div>':"")+'<div style="margin-top:22px"><button class="link-btn" id="backButton">← Back</button></div></div></div>');
      loadComments(release,id);
      if(release.published&&release.ratingsEnabled===true)renderRatingPanel(release,id);
      document.getElementById("backButton").onclick=()=>release.published?loadDiscover():loadLibrary();
      const claimButton=document.getElementById("claimRelease");if(claimButton)claimButton.onclick=()=>claimRelease(id);
      if(release.ownerId===currentUser?.uid){
        document.getElementById("editRelease").onclick=()=>loadCreate(release);
        document.getElementById("deleteRelease").onclick=async()=>{if(!confirm("Delete this release? This cannot be undone."))return;try{await deleteDoc(doc(db,"releases",id));await loadLibrary();}catch(error){alert(friendlyError(error));}};
      }
    }

    async function loadProfile(){
      libraryTab="profile";await loadLibrary();
    }

    document.querySelectorAll("[data-page]").forEach(button=>button.addEventListener("click",()=>{
      if(button.dataset.page==="discover")loadDiscover();
      if(button.dataset.page==="create")loadCreate();
      if(button.dataset.page==="library"){libraryTab="releases";loadLibrary();}
      if(button.dataset.page==="notifications")loadNotifications();
    }));
    document.getElementById("brandHome").onclick=loadDiscover;
    document.getElementById("loginOpen").onclick=()=>openAuth("login");
    document.getElementById("signupOpen").onclick=()=>openAuth("signup");

    onAuthStateChanged(auth,async user=>{
      currentUser=user;currentProfile=null;
      if(notificationUnsubscribe){notificationUnsubscribe();notificationUnsubscribe=null;}
      notificationCache=[];
      updateAccountUI();
      if(user){try{let snap=await getDoc(doc(db,"users",user.uid));for(let attempt=0;!snap.exists()&&attempt<5;attempt++){await new Promise(resolve=>setTimeout(resolve,250));snap=await getDoc(doc(db,"users",user.uid));}if(snap.exists())currentProfile=snap.data();else console.warn("Signed-in account has no matching Firestore profile.");}catch(error){console.error("Could not load account profile:",error);}}
      if(auth.currentUser?.uid!==user?.uid)return;
      updateAccountUI();
      if(user)subscribeToNotifications(user.uid);
      if(currentPage==="create")loadCreate();
      else if(currentPage==="library")loadLibrary();
      else if(currentPage==="notifications")loadNotifications();
      else loadDiscover();
    });
  </script>
</body>
