<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>K-Fanon Marketplace</title> 
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#fff;font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:#fff;color:#171717}button,input,textarea,select{font:inherit}button{cursor:pointer}
    .topbar{height:64px;border-bottom:1px solid #e9e9e9;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1120px)/2));position:sticky;top:0;background:#fff;z-index:5}
    .brand{font-weight:750;letter-spacing:-.6px;font-size:18px;cursor:pointer}.brand span{font-weight:400;color:#777}
    .nav{display:flex;align-items:center;gap:24px}.nav button,.link-btn{border:0;background:none;color:#555;padding:8px 0;font-size:14px}.nav button.active{color:#111;font-weight:650}
    .account-actions{display:flex;align-items:center;gap:12px}.account-status{display:flex;align-items:center;gap:8px;font-size:12px;color:#237a45;font-weight:650;white-space:nowrap}.account-status:before{content:"";width:7px;height:7px;border-radius:50%;background:#269653;display:inline-block}.button{border:1px solid #dedede;background:#fff;color:#171717;padding:10px 15px;border-radius:7px;font-size:14px;font-weight:600}.button:hover{background:#f7f7f7}.button.primary{background:#171717;color:#fff;border-color:#171717}.button.primary:hover{background:#333}.button:disabled{opacity:.5;cursor:not-allowed}
    .avatar{width:34px;height:34px;border-radius:50%;background:#f1f1f1;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #e8e8e8;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}
    main{max-width:1120px;margin:0 auto;padding:48px 24px 80px}.hero{padding:28px 0 34px;border-bottom:1px solid #eee;margin-bottom:32px}.eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#777;font-weight:700}.hero h1{font-size:clamp(34px,5vw,52px);letter-spacing:-2px;line-height:1.05;margin:14px 0 12px;font-weight:700}.hero p{color:#666;max-width:550px;line-height:1.65;margin:0;font-size:15px}
    .section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:0 0 20px}.section-head h2{font-size:21px;letter-spacing:-.5px;margin:0}.muted{color:#777;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}.release{min-width:0;cursor:pointer}.cover{width:100%;aspect-ratio:1;background:#f2f2f2;border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:36px}.cover img{width:100%;height:100%;object-fit:cover}.release h3{font-size:15px;margin:11px 0 4px;font-weight:650;overflow-wrap:anywhere}.release-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}.release .sub{font-size:13px;color:#777;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tag{font-size:10px;text-transform:uppercase;letter-spacing:.55px;color:#888;white-space:nowrap;flex:none}.preview-heading{font-size:13px;font-weight:650;margin:24px 0 12px}.preview-grid{max-width:210px}.preview-grid .release{cursor:default}
    .empty{padding:42px 20px;text-align:center;border:1px solid #eee;border-radius:8px;color:#777;font-size:14px}.empty strong{display:block;color:#222;margin-bottom:7px;font-size:15px}
    .page-title{font-size:30px;letter-spacing:-1px;margin:0 0 8px}.page-intro{color:#777;font-size:14px;margin:0 0 30px;line-height:1.6}
    .form-wrap{max-width:720px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}.field label{font-size:13px;font-weight:650}.field input,.field textarea,.field select{border:1px solid #dedede;border-radius:6px;padding:11px 12px;background:#fff;color:#171717;outline:none;width:100%;font-size:14px}.field input:focus,.field textarea:focus,.field select:focus{border-color:#777}.field textarea{resize:vertical;min-height:84px}.hint{font-size:12px;color:#888;margin-top:-2px}.track-row{display:grid;grid-template-columns:30px 1.1fr 1fr 1.2fr 36px;gap:9px;align-items:center;margin-bottom:9px}.spotify-link{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #e5e5e5;border-radius:50%;color:#171717;flex:none}.spotify-link:hover{background:#f4f4f4;border-color:#ccc}.spotify-link svg{width:17px;height:17px;display:block}.spotify-link-input{min-width:0}.track-num{font-size:12px;color:#888;text-align:center}.track-row input{min-width:0;border:1px solid #dedede;border-radius:6px;padding:10px;font-size:13px}.icon-button{border:0;background:none;color:#888;font-size:18px;padding:5px}.form-actions{display:flex;gap:10px;align-items:center;margin-top:22px}
    .tabs{display:flex;gap:20px;border-bottom:1px solid #eee;margin-bottom:25px}.tabs button{background:none;border:0;padding:0 0 12px;color:#777;font-size:14px}.tabs button.active{color:#171717;border-bottom:2px solid #171717;font-weight:650}
    .profile-head{display:flex;align-items:center;gap:16px;margin-bottom:28px}.profile-head .avatar{width:58px;height:58px;font-size:28px}.profile-head h2{margin:0 0 4px;font-size:22px}.profile-head p{margin:0;color:#777;font-size:13px}
    .notice{padding:12px 14px;background:#f7f7f7;border-radius:6px;color:#555;font-size:13px;line-height:1.5;margin:0 0 18px}.error{color:#b42318;font-size:13px;margin:10px 0}.success{color:#237a45;font-size:13px;margin:10px 0}
    .modal-backdrop{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal{width:100%;max-width:430px;background:#fff;border-radius:10px;padding:28px;max-height:90vh;overflow:auto}.modal h2{font-size:22px;margin:0 0 7px}.modal p{font-size:13px;color:#777;margin:0 0 22px;line-height:1.5}.modal-close{float:right;border:0;background:none;font-size:22px;color:#888}.modal-switch{font-size:13px;color:#777;margin-top:18px}.modal-switch button{border:0;background:none;text-decoration:underline;padding:0;color:#171717}
    .detail{display:grid;grid-template-columns:minmax(220px,360px) 1fr;gap:34px;align-items:start}.detail .cover{border-radius:5px}.detail h1{font-size:32px;letter-spacing:-1px;margin:0 0 7px}.detail-meta{color:#777;font-size:14px;margin-bottom:18px}.detail-description{font-size:14px;line-height:1.7;color:#555;white-space:pre-wrap}.track-list{margin-top:25px;border-top:1px solid #eee}.track{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #eee;font-size:13px}.track span:first-child{color:#888;width:25px}.track .track-title{flex:1}.track .track-credit{color:#888;text-align:right}.track .spotify-track-link{margin-left:4px}
    .footer{border-top:1px solid #eee;padding:24px;text-align:center;color:#999;font-size:12px}
    @media(max-width:800px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.topbar{padding:0 18px}.nav{gap:14px}main{padding:34px 20px 60px}}
    @media(max-width:600px){.track-row{grid-template-columns:22px minmax(90px,1fr) minmax(90px,1fr) minmax(120px,1.2fr) 25px;gap:5px}.track-row input{padding:9px 6px;font-size:11px}.topbar{height:auto;min-height:60px;flex-wrap:wrap;padding:13px 16px;gap:12px}.nav{order:3;width:100%;justify-content:space-between;border-top:1px solid #eee;padding-top:9px}.account-actions{margin-left:auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 13px}.hero{padding:18px 0 27px}.form-grid{grid-template-columns:1fr;gap:0}.detail{grid-template-columns:1fr;gap:22px}.detail .cover{max-width:360px}.track-row{grid-template-columns:25px 1fr 1fr 28px;gap:5px}.track-row input{padding:9px 7px;font-size:12px}.section-head{align-items:center}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand" id="brandHome">K-FANON <span>MARKETPLACE</span></div>
    <nav class="nav" aria-label="Main navigation">
      <button class="active" data-page="discover">Discover</button>
      <button data-page="create">Create</button>
      <button data-page="library">My library</button>
    </nav>
    <div class="account-actions" id="accountActions"><button class="button" id="loginOpen">Log in</button><button class="button primary" id="signupOpen">Sign up</button></div>
  </header>
  <main id="app"><div class="empty">Loading marketplace…</div></main>
  <footer class="footer">K-Fanon Marketplace</footer>
  <div id="modalRoot"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAuth, setPersistence, browserLocalPersistence, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, query, where, orderBy, limit, getDocs, serverTimestamp, runTransaction } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDvKObfLoyBrds-cSrtV9DSnBgCAXS28Mw",
      authDomain: "kfanon.firebaseapp.com",
      projectId: "kfanon",
      storageBucket: "kfanon.firebasestorage.app",
      messagingSenderId: "299218679697",
      appId: "1:299218679697:web:16e0b76721f5dbc3384c30"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const db = getFirestore(firebaseApp);
    await setPersistence(auth, browserLocalPersistence);

    const appRoot = document.getElementById("app");
    const modalRoot = document.getElementById("modalRoot");
    const accountActions = document.getElementById("accountActions");
    let currentUser = null;
    let currentProfile = null;
    let currentPage = "discover";
    let libraryTab = "releases";
    let cachedReleases = [];
    let editingReleaseId = null;
    let editingReleaseData = null;

    const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const safeImageUrl = value => { try { const url=new URL(value); return url.protocol==="https:" ? url.href : ""; } catch { return ""; } };
    const imageSource = (data,url) => data || safeImageUrl(url);
    async function compressImage(file,maxSide=800,maxChars=420000){
      if(!file) return "";
      if(!file.type.startsWith("image/")) throw new Error("Choose an image file.");
      if(file.size>10*1024*1024) throw new Error("Choose an image smaller than 10 MB.");
      const bitmap=await createImageBitmap(file);
      const scale=Math.min(1,maxSide/Math.max(bitmap.width,bitmap.height));
      const canvas=document.createElement("canvas");
      canvas.width=Math.max(1,Math.round(bitmap.width*scale));
      canvas.height=Math.max(1,Math.round(bitmap.height*scale));
      canvas.getContext("2d").drawImage(bitmap,0,0,canvas.width,canvas.height);
      bitmap.close();
      let quality=.82,result=canvas.toDataURL("image/jpeg",quality);
      while(result.length>maxChars && quality>.42){quality-=.08;result=canvas.toDataURL("image/jpeg",quality);}
      if(result.length>maxChars) throw new Error("This image is too detailed to store. Try a smaller image.");
      return result;
    }
    const avatarMarkup = (url,label="Profile picture",data="") => { const safe=imageSource(data,url); return '<span class="avatar">'+(safe?'<img src="'+escapeHtml(safe)+'" alt="'+escapeHtml(label)+'" referrerpolicy="no-referrer" onerror="this.remove()">':'')+'</span>'; };
    const showMessage = (text, type="error", target="formMessage") => { const node=document.getElementById(target); if(node){node.className=type;node.textContent=text;} };
    const friendlyError = error => {
      const messages = {
        "auth/email-already-in-use":"That email address is already registered.",
        "auth/invalid-email":"Enter a valid email address.",
        "auth/weak-password":"Choose a password with at least 6 characters.",
        "auth/invalid-credential":"Email or password is incorrect.",
        "auth/user-not-found":"No account was found with that email.",
        "auth/wrong-password":"Email or password is incorrect.",
        "permission-denied":"Firebase blocked this action. Check that the Firestore rules have been published.",
        "failed-precondition":"This query needs a Firestore index. Try again in a moment."
      };
      return messages[error.code] || error.message || "Something went wrong. Please try again.";
    };

    function renderShell(title, intro, content) {
      appRoot.innerHTML = (title ? '<h1 class="page-title">'+escapeHtml(title)+'</h1><p class="page-intro">'+escapeHtml(intro||"")+'</p>' : "") + content;
    }
    function coverMarkup(release, extraClass="") {
      const url = imageSource(release.coverData,release.coverUrl);
      return '<div class="cover '+extraClass+'">'+(url ? '<img src="'+escapeHtml(url)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove();this.parentElement.textContent=\'♪\'">' : "♪")+'</div>';
    }
    function releaseCard(release) {
      return '<article class="release" data-release="'+escapeHtml(release.id)+'">'+coverMarkup(release)+'<h3>'+escapeHtml(release.title)+'</h3><div class="release-meta"><div class="sub">'+escapeHtml(release.artist||"Unknown artist")+'</div><div class="tag">'+escapeHtml(release.type||"Album")+' · '+escapeHtml(release.tracks?.length||0)+' tracks</div></div></article>';
    }
    function timestampValue(value){if(!value)return 0;if(typeof value.toMillis==="function")return value.toMillis();if(typeof value.seconds==="number")return value.seconds*1000;const parsed=new Date(value).getTime();return Number.isFinite(parsed)?parsed:0;}
    function bindCards() {
      document.querySelectorAll("[data-release]").forEach(card=>card.addEventListener("click",()=>openRelease(card.dataset.release)));
    }

    async function loadDiscover() {
      currentPage="discover";
      renderShell("", "", '<section class="hero"><div class="eyebrow">A home for fictional music</div><h1>Your next favourite<br>release starts here.</h1><p>Explore fan-made K-pop discographies, build fictional albums and EPs, and bring your artists to life.</p></section><div class="section-head"><h2>Recently published</h2><span class="muted" id="releaseCount"></span></div><div id="discoverGrid" class="grid"><div class="muted">Loading releases…</div></div>');
      document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page==="discover"));
      try {
        const snap=await getDocs(query(collection(db,"releases"),where("published","==",true)));
        cachedReleases=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>timestampValue(b.createdAt)-timestampValue(a.createdAt)).slice(0,40);
        document.getElementById("releaseCount").textContent=cachedReleases.length+" releases";
        document.getElementById("discoverGrid").innerHTML=cachedReleases.length?cachedReleases.map(releaseCard).join(""):'<div class="empty" style="grid-column:1/-1"><strong>Nothing here just yet.</strong>Be the first to publish a fictional release.</div>';
        bindCards();
      } catch(error) { document.getElementById("discoverGrid").innerHTML='<div class="empty" style="grid-column:1/-1"><strong>Could not load releases.</strong>'+escapeHtml(friendlyError(error))+'</div>'; }
    }

    function openAuth(mode="login") {
      const signup=mode==="signup";
      modalRoot.innerHTML='<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="authTitle"><button class="modal-close" id="modalClose" aria-label="Close">×</button><h2 id="authTitle">'+(signup?"Create your account":"Welcome back")+'</h2><p>'+(signup?"Set up your K-Fanon Marketplace profile.":"Log in to continue to your marketplace.")+'</p><form id="authForm">'+(signup?'<div class="field"><label for="username">Username</label><input id="username" name="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" placeholder="yourusername" required><span class="hint">3–20 characters. Letters, numbers and underscores.</span></div><div class="field"><label for="displayName">Display name</label><input id="displayName" name="displayName" maxlength="32" placeholder="How should we know you?" required></div><div class="field"><label for="profilePicture">Profile picture</label><input id="profilePicture" type="file" accept="image/*"><span class="hint">Choose an image from your device. It will be resized before saving.</span></div>':"")+'<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" minlength="6" autocomplete="'+(signup?"new-password":"current-password")+'" required></div><div id="formMessage" class="error" role="alert"></div><button class="button primary" style="width:100%" type="submit">'+(signup?"Create account":"Log in")+'</button></form><div class="modal-switch">'+(signup?'Already have an account? <button id="switchAuth">Log in</button>':'New here? <button id="switchAuth">Create an account</button>')+'</div></section></div>';
      document.getElementById("modalClose").onclick=closeModal;
      document.getElementById("modalBackdrop").onclick=e=>{if(e.target.id==="modalBackdrop")closeModal()};
      document.getElementById("switchAuth").onclick=()=>openAuth(signup?"login":"signup");
      document.getElementById("authForm").onsubmit=async e=>{
        e.preventDefault(); const form=e.currentTarget; const button=form.querySelector("button[type=submit]"); button.disabled=true;button.textContent="Please wait…";
        try {
          const email=form.email.value.trim(); const password=form.password.value;
          if(signup){
            const username=form.username.value.trim().toLowerCase();
            if(!/^[a-z0-9_]{3,20}$/.test(username)) throw new Error("Username must be 3–20 characters using letters, numbers or underscores.");
            const displayName=form.displayName.value.trim(); if(!displayName) throw new Error("Please enter a display name.");
            const avatarData=await compressImage(form.profilePicture.files[0],320,180000);
            const credential=await createUserWithEmailAndPassword(auth,email,password);
            const profile={uid:credential.user.uid,username,displayName,avatarUrl:"",avatarData,createdAt:serverTimestamp()};
            try {
              await runTransaction(db,async transaction=>{
                const usernameRef=doc(db,"usernames",username);
                const usernameSnap=await transaction.get(usernameRef);
                if(usernameSnap.exists()) throw new Error("That username is already taken. Try another one.");
                transaction.set(usernameRef,{uid:credential.user.uid});
                transaction.set(doc(db,"users",credential.user.uid),profile);
              });
            } catch(err) { await credential.user.delete(); throw err; }
            await updateProfile(credential.user,{displayName});
          } else { await signInWithEmailAndPassword(auth,email,password); }
          closeModal();
        } catch(error) { showMessage(friendlyError(error)); button.disabled=false;button.textContent=signup?"Create account":"Log in"; }
      };
    }
    function closeModal(){modalRoot.innerHTML="";}

    function updateAccountUI() {
      if(currentUser){
        const label=currentProfile?.displayName||currentUser.displayName||currentProfile?.username||currentUser.email||"Your account";
        const profileControl=currentProfile
          ? '<button class="link-btn" id="profileOpen">'+avatarMarkup(currentProfile.avatarUrl,label,currentProfile.avatarData)+' '+escapeHtml(label)+'</button>'
          : '<span class="link-btn">'+escapeHtml(label)+'</span>';
        accountActions.innerHTML='<span class="account-status">Signed in</span>'+profileControl+'<button class="button" id="logoutButton">Log out</button>';
        const profileButton=document.getElementById("profileOpen");
        if(profileButton)profileButton.onclick=loadProfile;
        document.getElementById("logoutButton").onclick=()=>signOut(auth);
      } else {
        accountActions.innerHTML='<span class="account-status" style="color:#777">Not signed in</span><button class="button" id="loginOpen">Log in</button><button class="button primary" id="signupOpen">Sign up</button>';
        document.getElementById("loginOpen").onclick=()=>openAuth("login");
        document.getElementById("signupOpen").onclick=()=>openAuth("signup");
      }
    }

    async function loadCreate(release=null) {
      currentPage="create";
      if(!currentUser){renderShell("Create a release","Log in to build and save your fictional discography.",'<div class="notice">You need an account to create releases.</div><button class="button primary" id="createLogin">Log in</button>');document.getElementById("createLogin").onclick=()=>openAuth("login");return;}
      editingReleaseId=release?.id||null;
      editingReleaseData=release||null;
      const tracks=release?.tracks?.length?release.tracks:[{title:"",credit:""}];
      renderShell(release?"Edit release":"Create a release","Build an album or EP for your fictional artist.",'<div class="form-wrap"><form id="releaseForm"><div class="form-grid"><div class="field"><label for="releaseTitle">Release title *</label><input id="releaseTitle" maxlength="70" required value="'+escapeHtml(release?.title||"")+'" placeholder="e.g. The First Chapter"></div><div class="field"><label for="artistName">Artist / group *</label><input id="artistName" maxlength="60" required value="'+escapeHtml(release?.artist||"")+'" placeholder="e.g. NOVA"></div><div class="field"><label for="releaseType">Release type</label><select id="releaseType"><option '+(!release||release.type==="Album"?"selected":"")+' value="Album">Album</option><option '+(release?.type==="EP"?"selected":"")+' value="EP">EP</option><option '+(release?.type==="Single"?"selected":"")+' value="Single">Single</option><option '+(release?.type==="Mixtape"?"selected":"")+' value="Mixtape">Mixtape</option></select></div></div><div class="field"><label for="coverFile">Cover image</label><input id="coverFile" type="file" accept="image/*"><span class="hint">Choose an image from your device. Existing cover art is kept unless you select a replacement.</span></div><div class="preview-heading">Marketplace preview</div><div class="preview-grid" id="releasePreview"></div><div class="field"><label for="description">Description</label><textarea id="description" maxlength="600" placeholder="A short description of this release…">'+escapeHtml(release?.description||"")+'</textarea></div><div class="section-head"><h2>Tracklist</h2><span class="muted" id="trackCount">'+tracks.length+' tracks</span></div><div id="trackRows">'+tracks.map((t,i)=>trackRow(t,i)).join("")+'</div><button class="button" type="button" id="addTrack">+ Add track</button><div class="field" style="margin-top:24px"><label><input type="checkbox" id="publishRelease" style="width:auto;margin-right:8px" '+(release?.published?"checked":"")+'> Publish this release to Discover</label><span class="hint">Unpublished releases are only visible in your library.</span></div><div id="formMessage" class="error"></div><div class="form-actions"><button class="button primary" type="submit">'+(release?"Save changes":"Save release")+'</button><button class="button" type="button" id="cancelCreate">Cancel</button></div></form></div>');
      document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page==="create"));
      const rows=document.getElementById("trackRows");
      document.getElementById("addTrack").onclick=()=>{const n=rows.children.length;rows.insertAdjacentHTML("beforeend",trackRow({title:"",credit:""},n));updateTrackRows();};
      document.getElementById("cancelCreate").onclick=()=>loadLibrary();
      rows.addEventListener("click",e=>{if(e.target.matches("[data-remove-track]")){if(rows.children.length>1){e.target.closest(".track-row").remove();updateTrackRows();}}});
      rows.addEventListener("input",updateTrackRows);
      document.getElementById("releaseForm").onsubmit=saveRelease;
      updateTrackRows();
      ["releaseTitle","artistName","releaseType"].forEach(id=>document.getElementById(id).addEventListener("input",updateReleasePreview));
      document.getElementById("coverFile").addEventListener("change",updateReleasePreview);
      updateReleasePreview();
    }
    function updateReleasePreview(){
      const title=document.getElementById("releaseTitle")?.value.trim()||"Release title";
      const artist=document.getElementById("artistName")?.value.trim()||"Artist / group";
      const type=document.getElementById("releaseType")?.value||"Album";
      const trackCount=document.querySelectorAll(".track-row").length;
      const preview=document.getElementById("releasePreview");
      if(!preview)return;
      const file=document.getElementById("coverFile")?.files?.[0];
      const existing=editingReleaseData||{};
      const render=data=>{preview.innerHTML=releaseCardPreview({title,artist,type,tracks:Array.from({length:trackCount}),coverData:data||existing.coverData||"",coverUrl:data?"":(existing.coverUrl||"")});};
      if(file){const reader=new FileReader();reader.onload=()=>render(reader.result);reader.readAsDataURL(file);}else render("");
    }
    function releaseCardPreview(release){
      return '<article class="release">'+coverMarkup(release)+'<h3>'+escapeHtml(release.title)+'</h3><div class="release-meta"><div class="sub">'+escapeHtml(release.artist)+'</div><div class="tag">'+escapeHtml(release.type)+' · '+release.tracks.length+' tracks</div></div></article>';
    }
    function normalizeSpotifyTrackUrl(value){
      const raw=String(value||"").trim();
      if(!raw)return "";
      let url;try{url=new URL(raw);}catch{throw new Error("Enter a valid Spotify track link, or leave the field blank.");}
      const match=url.hostname==="open.spotify.com"&&url.protocol==="https:"?url.pathname.match(/^\/track\/([A-Za-z0-9]{22})\/?$/):null;
      if(!match)throw new Error("Use a Spotify track link in the format https://open.spotify.com/track/…");
      return "https://open.spotify.com/track/"+match[1];
    }
    function spotifyButton(value){
      let url="";
      try{url=normalizeSpotifyTrackUrl(value);}catch{return "";}
      if(!url)return "";
      return '<a class="spotify-link spotify-track-link" href="'+escapeHtml(url)+'" target="_blank" rel="noopener noreferrer" aria-label="Listen on Spotify" title="Listen on Spotify"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M5.4 9.1c4.8-1.45 9.7-.95 13.4 1.15M6.2 12.1c4.1-1.15 8.5-.72 11.8 1.02M7 15c3.35-.85 7-.48 10.1.9" fill="none" stroke="#fff" stroke-width="1.45" stroke-linecap="round"/></svg></a>';
    }
    function trackRow(track,index){
      return '<div class="track-row"><span class="track-num">'+(index+1)+'</span><input aria-label="Track '+(index+1)+' title" class="track-title-input" maxlength="100" placeholder="Track title" value="'+escapeHtml(track.title||"")+'" required><input aria-label="Track '+(index+1)+' credit" class="track-credit-input" maxlength="100" placeholder="Original artist (optional)" value="'+escapeHtml(track.credit||"")+'"><input aria-label="Track '+(index+1)+' Spotify link (optional)" class="track-spotify-input" type="url" placeholder="Spotify link (optional)" value="'+escapeHtml(track.spotifyUrl||"")+'"><button class="icon-button" type="button" data-remove-track aria-label="Remove track">×</button></div>';
    }
    function updateTrackRows(){const rows=[...document.querySelectorAll(".track-row")];rows.forEach((r,i)=>r.querySelector(".track-num").textContent=i+1);const count=document.getElementById("trackCount");if(count)count.textContent=rows.length+" tracks";updateReleasePreview();}
    async function saveRelease(e){
      e.preventDefault(); const form=e.currentTarget;const button=form.querySelector('button[type="submit"]');button.disabled=true;button.textContent="Saving…";
      try{
        const tracks=[...form.querySelectorAll(".track-row")].map(row=>({title:row.querySelector(".track-title-input").value.trim(),credit:row.querySelector(".track-credit-input").value.trim(),spotifyUrl:normalizeSpotifyTrackUrl(row.querySelector(".track-spotify-input").value)})).filter(t=>t.title);
        if(!tracks.length)throw new Error("Add at least one track to your release.");
        const data={title:form.releaseTitle.value.trim(),artist:form.artistName.value.trim(),type:form.releaseType.value,coverUrl:form.coverFile.files[0]?"":(editingReleaseData?.coverUrl||""),coverData:form.coverFile.files[0]?await compressImage(form.coverFile.files[0],1000,420000):(editingReleaseData?.coverData||""),description:form.description.value.trim(),tracks,published:form.publishRelease.checked,ownerId:currentUser.uid,ownerName:currentProfile.displayName||currentProfile.username,updatedAt:serverTimestamp()};
        if(editingReleaseId){await updateDoc(doc(db,"releases",editingReleaseId),data);}
        else{data.createdAt=serverTimestamp();await setDoc(doc(collection(db,"releases")),data);}
        await loadLibrary();
      }catch(error){showMessage(friendlyError(error));button.disabled=false;button.textContent=editingReleaseId?"Save changes":"Save release";}
    }

    async function loadLibrary(){
      currentPage="library";
      if(!currentUser){renderShell("My library","Your releases will appear here once you log in.",'<div class="notice">Log in or create an account to manage your releases.</div><button class="button primary" id="libraryLogin">Log in</button>');document.getElementById("libraryLogin").onclick=()=>openAuth("login");return;}
      renderShell("My library","Manage your fictional discography.",'<div class="tabs"><button class="'+(libraryTab==="releases"?"active":"")+'" data-library-tab="releases">My releases</button><button class="'+(libraryTab==="profile"?"active":"")+'" data-library-tab="profile">Profile settings</button></div><div id="libraryContent"><div class="muted">Loading…</div></div>');
      document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page==="library"));
      document.querySelectorAll("[data-library-tab]").forEach(b=>b.onclick=()=>{libraryTab=b.dataset.libraryTab;loadLibrary();});
      if(libraryTab==="profile"){renderProfileSettings();return;}
      try{
        const snap=await getDocs(query(collection(db,"releases"),where("ownerId","==",currentUser.uid)));
        const releases=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>timestampValue(b.updatedAt)-timestampValue(a.updatedAt));
        document.getElementById("libraryContent").innerHTML='<div class="section-head"><span class="muted">'+releases.length+' releases</span><button class="button primary" id="newRelease">Create release</button></div>'+(releases.length?'<div class="grid">'+releases.map(r=>'<div>'+releaseCard(r)+'<div class="muted" style="margin-top:7px;font-size:12px">'+(r.published?"Published":"Draft")+'</div></div>').join("")+'</div>':'<div class="empty"><strong>Your library is empty.</strong>Create your first album or EP to get started.</div>');
        document.getElementById("newRelease").onclick=()=>loadCreate();
        bindCards();
        document.querySelectorAll("[data-release]").forEach(card=>card.addEventListener("contextmenu",e=>e.preventDefault()));
      }catch(error){document.getElementById("libraryContent").innerHTML='<div class="error">'+escapeHtml(friendlyError(error))+'</div>';}
    }
    function renderProfileSettings(){
      const content=document.getElementById("libraryContent");
      content.innerHTML='<div class="form-wrap"><form id="profileForm"><div class="field"><label for="profileUsername">Username</label><input id="profileUsername" value="'+escapeHtml(currentProfile.username||"")+'" disabled><span class="hint">Usernames cannot be changed in this version.</span></div><div class="field"><label for="profileDisplay">Display name</label><input id="profileDisplay" maxlength="32" required value="'+escapeHtml(currentProfile.displayName||"")+'"></div><div class="field"><label for="profilePictureFile">Profile picture</label><input id="profilePictureFile" type="file" accept="image/*"><span class="hint">Choose a new image to replace your current picture. Leave blank to keep it.</span></div><div id="formMessage" class="error"></div><button class="button primary" type="submit">Save profile</button></form></div>';
      document.getElementById("profileForm").onsubmit=async e=>{e.preventDefault();const displayName=document.getElementById("profileDisplay").value.trim();if(!displayName)return;try{const file=document.getElementById("profilePictureFile").files[0];const avatarData=file?await compressImage(file,320,180000):(currentProfile.avatarData||"");const avatarUrl=file?"":(currentProfile.avatarUrl||"");await updateDoc(doc(db,"users",currentUser.uid),{displayName,avatarUrl,avatarData});await updateProfile(currentUser,{displayName});currentProfile={...currentProfile,displayName,avatarUrl,avatarData};updateAccountUI();showMessage("Profile updated.","success");}catch(error){showMessage(friendlyError(error));}};
    }

    async function openRelease(id){
      let release=cachedReleases.find(r=>r.id===id);
      try{const snap=await getDoc(doc(db,"releases",id));if(!snap.exists())throw new Error("This release is no longer available.");release={id:snap.id,...snap.data()};}
      catch(error){renderShell("Release unavailable","",'<div class="error">'+escapeHtml(friendlyError(error))+'</div><button class="button" id="backDiscover">Back to Discover</button>');document.getElementById("backDiscover").onclick=loadDiscover;return;}
      if(!release.published && release.ownerId!==currentUser?.uid){loadDiscover();return;}
      currentPage="detail";
      renderShell("", "",'<div class="detail"><div>'+coverMarkup(release)+'</div><div><div class="eyebrow">'+escapeHtml(release.type||"Release")+'</div><h1>'+escapeHtml(release.title)+'</h1><div class="detail-meta">'+escapeHtml(release.artist)+'</div><div class="detail-description">'+escapeHtml(release.description||"")+'</div><div class="track-list">'+(release.tracks||[]).map((t,i)=>'<div class="track"><span>'+String(i+1).padStart(2,"0")+'</span><span class="track-title">'+escapeHtml(t.title)+'</span><span class="track-credit">'+escapeHtml(t.credit||"")+'</span>'+spotifyButton(t.spotifyUrl)+'</div>').join("")+'</div><p class="muted" style="margin-top:18px">Created by '+escapeHtml(release.ownerName||"A community member")+'</p>'+(release.ownerId===currentUser?.uid?'<div class="form-actions"><button class="button" id="editRelease">Edit release</button><button class="button" id="deleteRelease">Delete</button></div>':"")+'<div style="margin-top:22px"><button class="link-btn" id="backButton">← Back</button></div></div></div>');
      document.getElementById("backButton").onclick=()=>currentPage==="detail"?(release.published?loadDiscover():loadLibrary()):loadDiscover();
      if(release.ownerId===currentUser?.uid){
        document.getElementById("editRelease").onclick=()=>loadCreate(release);
        document.getElementById("deleteRelease").onclick=async()=>{if(!confirm("Delete this release? This cannot be undone."))return;try{await deleteDoc(doc(db,"releases",id));await loadLibrary();}catch(error){alert(friendlyError(error));}};
      }
    }

    async function loadProfile(){
      libraryTab="profile";await loadLibrary();
    }

    document.querySelectorAll("[data-page]").forEach(button=>button.addEventListener("click",()=>{
      if(button.dataset.page==="discover")loadDiscover();
      if(button.dataset.page==="create")loadCreate();
      if(button.dataset.page==="library"){libraryTab="releases";loadLibrary();}
    }));
    document.getElementById("brandHome").onclick=loadDiscover;
    document.getElementById("loginOpen").onclick=()=>openAuth("login");
    document.getElementById("signupOpen").onclick=()=>openAuth("signup");

    onAuthStateChanged(auth,async user=>{
      currentUser=user;currentProfile=null;
      updateAccountUI();
      if(user){try{const snap=await getDoc(doc(db,"users",user.uid));if(snap.exists())currentProfile=snap.data();else console.warn("Signed-in account has no matching Firestore profile.");}catch(error){console.error("Could not load account profile:",error);}}
      if(auth.currentUser?.uid!==user?.uid)return;
      updateAccountUI();
      if(currentPage==="create")loadCreate();
      else if(currentPage==="library")loadLibrary();
      else loadDiscover();
    });
  </script>
</body>
</html>
